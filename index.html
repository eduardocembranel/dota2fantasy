  <!-- Global operations panel -->
  <section class="global-operations">
    <div class="operations-panel">
      <h2 class="panel-title">Probability Calculator</h2>
      <label class="fractal-toggle">
        <input type="checkbox" id="ignore-fractal-bonus" class="fractal-toggle__input" />
        <span class="fractal-toggle__label">Ignore fractal bonus in simulation</span>
        <span
          class="fractal-toggle__hint"
          tabindex="0"
          role="button"
          aria-label="Why ignore fractal bonus?"
          onmousedown="event.preventDefault()"
        >
          ?
          <span class="fractal-toggle__tooltip">
            In most cases, ignoring fractal bonus gives more realistic simulation results.
            The +60% requires all active qualities to be different — as qualities improve
            over time, that condition usually breaks and the bonus disappears, making
            fractal-driven gains or losses often misleading.
          </span>
        </span>
      </label>
      <div class="op-tabs">
        <button class="op-tab-btn active" data-target="stats">Stats</button>
        <button class="op-tab-btn" data-target="quality">Qualities</button>
        <button class="op-tab-btn" data-target="trait">Traits</button>
      </div>
      
      <div class="op-content active" data-content="stats">
        <div class="op-group">
          <button class="op-btn op-btn--green" data-operation="rerollStatForGreenEmblems">Reroll Stat for Green Emblems</button>
          <button class="op-btn op-btn--green" data-operation="rerollStatForFirstGreenEmblem">Reroll Stat for the first Green Emblem</button>
          <button class="op-btn op-btn--green" data-operation="rerollStatForLastGreenEmblem">Reroll Stat for the last Green Emblem</button>
          <button class="op-btn op-btn--green" data-operation="rerollStatForRandomGreenEmblem">Reroll Stat for one random Green Emblem</button>
        </div>
        
        <div class="op-group">
          <button class="op-btn op-btn--red" data-operation="rerollStatForRedEmblems">Reroll Stat for Red Emblems</button>

        <div class="op-group">

        </div>
      </div>
      
      <div class="op-content" data-content="quality">
